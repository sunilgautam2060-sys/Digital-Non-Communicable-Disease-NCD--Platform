<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Change Password | NCD Nepal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <style>
        body { margin: 0; padding: 32px 18px; background: #f4f7fb; color: #172033; font-family: Arial, sans-serif; }
        main { max-width: 520px; margin: 0 auto; background: white; padding: 28px; border-radius: 14px; }
        label { display: block; margin: 16px 0 6px; } input { width: 100%; padding: 11px; box-sizing: border-box; }
        button { margin-top: 20px; padding: 11px 18px; cursor: pointer; } .error { color: #b42318; } .success { color: #087f43; }
    </style>
</head>
<body>
<main>
    <h1>Change Password</h1>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    {% if success %}<p class="success" role="status">{{ success }}</p>{% endif %}
    <form method="post" action="{{ url_for('change_password') }}">
        <label for="current_password">Current password</label>
        <input id="current_password" name="current_password" type="password" required autocomplete="current-password">
        <label for="new_password">New password</label>
        <input id="new_password" name="new_password" type="password" minlength="8" required autocomplete="new-password">
        <label for="confirm_password">Confirm new password</label>
        <input id="confirm_password" name="confirm_password" type="password" minlength="8" required autocomplete="new-password">
        <button type="submit">Update password</button>
    </form>
    <p><a href="{{ url_for('settings') }}">Back to settings</a></p>
</main>
<script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</body>
</html>
